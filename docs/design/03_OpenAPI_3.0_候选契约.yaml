    post:
      tags:
      - M6 在线权限鉴定
      operationId: AU03
      summary: 业务服务端实时 API 鉴权
      description: '服务端可信凭据绑定 appCode；HTTP 方法和实际路由由业务服务端识别，用户从 JWT 确认。检查账号、部门祖先、有效菜单、API 及版本/栅栏，并可靠接收审计。仅 data.allowed=true
        才能执行；对象级 M5 检查仍在实际业务入口进行。

        补充：请求头同时要求用户 Bearer JWT 和可信服务凭据；不能让浏览器直接调用此接口。HTTP 200 仅表示成功取得决策，仍必须查看 data.allowed。

        接口路径和安全协议尚待联调冻结。

        调用方必须将用户Bearer JWT与经过认证的服务身份一并提交；失败、超时、未明确返回 allowed=true 均不得放行。实际路由由可信业务服务端确定。'
      security:
      - ServiceSignature: []
        UserBearer: []
      parameters:
      - name: X-Client-Id
        in: header
        required: false
