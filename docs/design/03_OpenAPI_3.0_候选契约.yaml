      - 公共支撑：审计查询
      operationId: LG04
      summary: 查询授权或变更审计证据
      description: '审计证据包括事件摘要、当时授权版本、签名信息和相关 requestId；普通接口只允许读取，不宣称当前库已具备 WORM 防篡改能力。

        接口路径和安全协议尚待联调冻结。'
      security:
      - UserBearer: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
        example: EV-01
      responses:
        '200':
          description: 操作已完成或查询成功；鉴权接口还须检查 data.allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  code:
                    type: string
                  requestId:
                    type: string
                  data:
                    type: object
                    properties:
                      eventId:
                        type: string
                      requestId:
                        type: string
                      evidenceType:
                        type: string
                      permissionVersion:
                        type: string
                      integrityVerified:
                        type: boolean
                    additionalProperties: false
                    required:
                    - eventId
                    - requestId
                    - evidenceType
                    - permissionVersion
                    - integrityVerified
                additionalProperties: false
                required:
                - success
                - code
                - requestId
                - data
              example:
                success: true
                code: OK
                requestId: req-demo
                data:
                  eventId: EV-001
                  requestId: req-demo
                  evidenceType: GRANT_CHANGE
                  permissionVersion: v30
                  integrityVerified: true
        '400':
          description: 参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 身份或令牌无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无相应功能、对象范围或委派资格
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 资源不存在或无权查看
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 必要可信权限状态、签名、审计或外部服务不可用；安全拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-authorization-requirement: 管理端；`IAM_AUDIT_VIEW+M5_SCOPE`。
components:
  securitySchemes:
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ServiceSignature:
      type: apiKey
      in: header
      name: X-Request-Signature
      description: 候选方案：TLS+已登记服务客户端ID、请求时间戳、nonce、签名；可替换为真实mTLS服务端校验方案。必须绑定可信应用及服务执行范围。OpenAPI此处描述的是请求签名候选，不代表双方已冻结。
  schemas:
    ApiError:
      type: object
      required:
      - success
      - code
      - message
      - requestId
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
      additionalProperties: false
    ApiEnvelope:
      type: object
      required:
      - success
      - code
      - requestId
      properties:
        success:
          type: boolean
        code:
          type: string
        requestId:
          type: string
        data:
          type: object
          additionalProperties: true
      description: 通用成功响应外层包装；各操作会定义 data 字段的具体结构。
