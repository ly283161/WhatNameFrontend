openapi: 3.0.3
info:
  title: 统一权限管理系统：六业务模块 RBAC0 API 候选契约
  version: 0.5.0
  description: 与 01_系统详细设计说明书.md 和 02_API接口设计规范.md 同步。56项（GR06可选），保留旧49项编号；原 AU06（短信验证码登录）已按需求删除，登录方式仅账号密码、手机号密码两种，短信验证码只用于首次设密与密码重置。已确认业务规则；外部 HR/OA 服务认证协议、短信限制、数据库持久化与跨实例实时撤权细节仍需联调冻结。JSON示例为虚构测试数据。
servers:
- url: https://iam.example.test/api/v1
  description: 占位地址（非真实部署地址）
tags:
- name: M1 身份认证与账号管理
- name: M2 组织与人员变动管理
- name: M3 应用权限资源管理
- name: M4 角色与授权管理
- name: M5 管理员与管理范围控制
- name: M6 在线权限鉴定
- name: 公共支撑：审计查询
paths:
  /auth/login:
    post:
      tags:
      - M1 身份认证与账号管理
      operationId: AU01
      summary: 用户名或手机号密码登录
      description: '用户名或手机号均可作为登录标识（账号密码、手机号密码两种方式，均为密码登录，不提供短信验证码登录）；检查密码是否已初始化（未设密拒绝登录）、scrypt 哈希、账号及必要签名；部门冻结不阻止登录。失败不披露账号是否存在。

        接口路径和安全协议尚待联调冻结。'
      security: []
      parameters: []
      responses:
        '200':
          description: 操作已完成或查询成功；鉴权接口还须检查 data.allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  code:
                    type: string
                  requestId:
                    type: string
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      tokenType:
                        type: string
                      expiresIn:
                        type: integer
                      userId:
                        type: string
                    additionalProperties: false
                    required:
                    - accessToken
                    - tokenType
                    - expiresIn
                    - userId
                additionalProperties: false
                required:
                - success
                - code
                - requestId
                - data
              example:
                success: true
                code: OK
                requestId: req-demo
                data:
                  accessToken: <JWT>
                  tokenType: Bearer
                  expiresIn: 3600
                  userId: '101'
        '400':
          description: 参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 身份或令牌无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 发送、登录或敏感操作频率受限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 必要可信权限状态、签名、审计或外部服务不可用；安全拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                loginType:
                  type: string
                  enum:
                  - USERNAME
                  - PHONE
                identifier:
                  type: string
                password:
                  type: string
                  writeOnly: true
                  format: password
              additionalProperties: false
              required:
              - loginType
              - identifier
              - password
            example:
              loginType: USERNAME
              identifier: zs
              password: <PASSWORD>
      x-authorization-requirement: 用户/业务系统入口；`PUBLIC`。
  /auth/sms/send:
    post:
      tags:
      - M1 身份认证与账号管理
      operationId: AU05
      summary: 发送短信验证码
      description: '按 SET_PASSWORD、RESET_PASSWORD 隔离用途（验证码仅用于验证本人身份以设密/重置，不用于登录），限制手机号格式、发送频率和次数；验证码不可复用。响应不得暴露手机号是否已注册或验证码值。短信服务提供商与过期时长待联调。

        接口路径和安全协议尚待联调冻结。'
      x-authorization-requirement: 用户/业务系统入口；`PUBLIC`。
      parameters: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                purpose:
                  type: string
                  enum:
                  - SET_PASSWORD
                  - RESET_PASSWORD
              additionalProperties: false
              required:
              - phone
              - purpose
            example:
              phone: '13800000000'
              purpose: SET_PASSWORD
      responses:
        '200':
          description: 操作已完成或查询成功；鉴权接口还须检查 data.allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  code:
                    type: string
                  requestId:
                    type: string
                  data:
                    type: object
                    properties:
                      accepted:
                        type: boolean
                      retryAfterSeconds:
                        type: integer
                    additionalProperties: false
                    required:
                    - accepted
                    - retryAfterSeconds
                additionalProperties: false
                required:
                - success
                - code
                - requestId
                - data
              example:
                success: true
                code: OK
                requestId: req-demo
                data:
                  accepted: true
                  retryAfterSeconds: 60
        '400':
          description: 参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 身份或令牌无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 发送、登录或敏感操作频率受限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 必要可信权限状态、签名、审计或外部服务不可用；安全拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/password/initialize:
    post:
      tags:
      - M1 身份认证与账号管理
      operationId: AU07
      summary: 首次设置登录密码
      description: '使用绑定手机号和 SET_PASSWORD 专用验证码验证本人；仅账号可用且密码未初始化时设置新密码。验证码一次性核销，密码带盐哈希保存，禁止返回明文。

        接口路径和安全协议尚待联调冻结。'
      x-authorization-requirement: 用户/业务系统入口；`PUBLIC_SMS_PROOF`。
      parameters: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                code:
                  type: string
                  writeOnly: true
                newPassword:
                  type: string
                  writeOnly: true
                  format: password
              additionalProperties: false
              required:
              - phone
              - code
              - newPassword
            example:
              phone: '13800000000'
              code: '123456'
              newPassword: <NEW_PASSWORD>
      responses:
        '200':
          description: 操作已完成或查询成功；鉴权接口还须检查 data.allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  code:
                    type: string
                  requestId:
                    type: string
                  data:
                    type: object
                    properties:
                      initialized:
                        type: boolean
                    additionalProperties: false
                    required:
                    - initialized
                additionalProperties: false
                required:
                - success
                - code
                - requestId
                - data
              example:
                success: true
                code: OK
                requestId: req-demo
                data:
                  initialized: true
        '400':
          description: 参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 身份或令牌无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 发送、登录或敏感操作频率受限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 必要可信权限状态、签名、审计或外部服务不可用；安全拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/password/reset:
    post:
      tags:
      - M1 身份认证与账号管理
      operationId: AU08
      summary: 短信验证后重置密码
      description: '验证账号可用及 RESET_PASSWORD 专用验证码，更改密码并使所有旧会话失效；密码重置即使原 JWT 有效也不得保留旧会话授权。

        可信状态：可能缩减权限，遵循受控撤权/会话失效规则。

        接口路径和安全协议尚待联调冻结。'
      x-authorization-requirement: 用户/业务系统入口；`PUBLIC_SMS_PROOF`。
      parameters: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                code:
                  type: string
                  writeOnly: true
                newPassword:
                  type: string
                  writeOnly: true
                  format: password
              additionalProperties: false
              required:
              - phone
              - code
              - newPassword
            example:
              phone: '13800000000'
              code: '123456'
              newPassword: <NEW_PASSWORD>
      responses:
        '200':
          description: 操作已完成或查询成功；鉴权接口还须检查 data.allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  code:
                    type: string
                  requestId:
                    type: string
                  data:
                    type: object
                    properties:
                      passwordReset:
                        type: boolean
                      sessionsInvalidated:
                        type: boolean
                    additionalProperties: false
                    required:
                    - passwordReset
                    - sessionsInvalidated
                additionalProperties: false
                required:
                - success
                - code
                - requestId
                - data
              example:
                success: true
                code: OK
                requestId: req-demo
                data:
                  passwordReset: true
                  sessionsInvalidated: true
        '400':
          description: 参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 身份或令牌无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 发送、登录或敏感操作频率受限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 必要可信权限状态、签名、审计或外部服务不可用；安全拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/logout:
    post:
      tags:
      - M1 身份认证与账号管理
      operationId: AU04
      summary: 注销当前 JWT 会话
      description: '从 Bearer JWT 确认会话标识；可靠写入共享失效状态后才返回成功。即使部门被冻结也允许注销。

        可信状态：可能缩减权限，遵循受控撤权/会话失效规则。

        接口路径和安全协议尚待联调冻结。'
      security:
      - UserBearer: []
      parameters: []
      responses:
        '200':
          description: 操作已完成或查询成功；鉴权接口还须检查 data.allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  code:
                    type: string
                  requestId:
                    type: string
                  data:
                    type: object
                    properties:
                      revoked:
                        type: boolean
                    additionalProperties: false
                    required:
                    - revoked
                additionalProperties: false
                required:
                - success
                - code
                - requestId
                - data
              example:
                success: true
                code: OK
                requestId: req-demo
                data:
                  revoked: true
        '400':
          description: 参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 身份或令牌无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无相应功能、对象范围或委派资格
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 必要可信权限状态、签名、审计或外部服务不可用；安全拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-authorization-requirement: 已登录用户；`USER_SELF`。
  /users:
    get:
      tags:
      - M1 身份认证与账号管理
      operationId: US01
      summary: 按管理范围查询用户
      description: 'M6 检查功能权限、M5 将搜索限定至当前部门根及子树；关键字段经允许后解密、手机号只返回掩码。

        接口路径和安全协议尚待联调冻结。'
      security:
      - UserBearer: []
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: deptId
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: integer
      - name: source
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
        example: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
        example: 20
      responses:
        '200':
          description: 操作已完成或查询成功；鉴权接口还须检查 data.allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  code:
                    type: string
                  requestId:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            userId:
                              type: string
                            username:
                              type: string
                            sgNo:
                              type: string
                            realName:
                              type: string
                            phoneMasked:
                              type: string
                            deptId:
                              type: string
                            status:
                              type: integer
                          additionalProperties: false
                          required:
                          - deptId
                          - phoneMasked
                          - realName
                          - sgNo
                          - status
                          - userId
                          - username
                      page:
                        type: integer
                        minimum: 1
                      pageSize:
                        type: integer
                        minimum: 1
                      total:
                        type: integer
                    additionalProperties: false
                    required:
                    - items
                    - page
                    - pageSize
                    - total
                additionalProperties: false
                required:
                - success
                - code
                - requestId
                - data
              example:
                success: true
                code: OK
                requestId: req-demo
                data:
                  items:
                  - userId: '101'
                    username: zs
                    sgNo: SG000123
                    realName: 示例用户
                    phoneMasked: 138****0000
                    deptId: '17'
                    status: 1
                  page: 1
                  pageSize: 20
                  total: 1
        '400':
          description: 参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 身份或令牌无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无相应功能、对象范围或委派资格
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 必要可信权限状态、签名、审计或外部服务不可用；安全拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-authorization-requirement: 管理端；`IAM_USERS_VIEW+M5_SCOPE`。
  /users/{userId}:
    get:
      tags:
      - M1 身份认证与账号管理
      operationId: US02
      summary: 查询用户详情
      description: '根据真实 userId 查询所属部门并重新执行 M5 范围检查；不能仅凭列表已过滤跳过详情校验。

        接口路径和安全协议尚待联调冻结。'
      security:
      - UserBearer: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
        example: '101'
      responses:
        '200':
          description: 操作已完成或查询成功；鉴权接口还须检查 data.allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  code:
                    type: string
                  requestId:
                    type: string
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                      username:
                        type: string
                      sgNo:
                        type: string
                      realName:
                        type: string
                      phoneMasked:
                        type: string
                      deptId:
                        type: string
                      status:
                        type: integer
                      passwordInitialized:
                        type: boolean
                    additionalProperties: false
                    required:
                    - userId
                    - username
                    - sgNo
                    - realName
                    - phoneMasked
                    - deptId
                    - status
                    - passwordInitialized
                additionalProperties: false
                required:
                - success
                - code
                - requestId
                - data
              example:
                success: true
                code: OK
                requestId: req-demo
                data:
                  userId: '101'
                  username: zs
                  sgNo: SG000123
                  realName: 示例用户
                  phoneMasked: 138****0000
                  deptId: '17'
                  status: 1
                  passwordInitialized: true
        '400':
          description: 参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 身份或令牌无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无相应功能、对象范围或委派资格
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 资源不存在或无权查看
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 必要可信权限状态、签名、审计或外部服务不可用；安全拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-authorization-requirement: 管理端；`IAM_USERS_VIEW+M5_SCOPE`。
  /users/temporary:
    post:
      tags:
      - M1 身份认证与账号管理
      operationId: US03
      summary: 创建无 SG 号的临时账号
      description: '仅创建 source=2/employee_no=NULL 的临时用户（普通账号，不设独立类型）；手机号必填且全局唯一，不能创建带工号的正式/外包人员（有工号账号只能由 HR 同步生成）。禁止管理员设置初始明文密码，未设密不能登录，首次由本人短信验证设密（AU05→AU07）后方可登录。临时用户名服务端生成唯一值，生成格式待联调。

        可信状态：可能扩大权限，只在可信版本可见后生效。

        接口路径和安全协议尚待联调冻结。'
      security:
      - UserBearer: []
      parameters: []
      responses:
        '200':
          description: 操作已完成或查询成功；鉴权接口还须检查 data.allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  code:
                    type: string
                  requestId:
                    type: string
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                      username:
                        type: string
                      source:
                        type: integer
                      phoneMasked:
                        type: string
                      deptId:
                        type: string
                      status:
                        type: integer
                    additionalProperties: false
                    required:
                    - userId
                    - username
                    - source
                    - phoneMasked
                    - deptId
                    - status
                additionalProperties: false
                required:
                - success
                - code
                - requestId
                - data
              example:
                success: true
                code: OK
                requestId: req-demo
                data:
                  userId: '301'
                  username: temp301
                  source: 2
                  phoneMasked: 138****0000
                  deptId: '17'
                  status: 1
        '400':
          description: 参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 身份或令牌无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无相应功能、对象范围或委派资格
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 数据版本、唯一性或幂等事件冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 必要可信权限状态、签名、审计或外部服务不可用；安全拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
