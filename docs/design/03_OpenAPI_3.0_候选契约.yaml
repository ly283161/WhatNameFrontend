                  code:
                    type: string
                  requestId:
                    type: string
                  data:
                    type: object
                    properties:
                      allowed:
                        type: boolean
                      reasonCode:
                        type: string
                      decisionId:
                        type: string
                      permissionVersion:
                        type: string
                    additionalProperties: false
                    required:
                    - allowed
                    - reasonCode
                    - decisionId
                    - permissionVersion
                additionalProperties: false
                required:
                - success
                - code
                - requestId
                - data
              examples:
